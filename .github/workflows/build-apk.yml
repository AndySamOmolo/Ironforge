name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'IronForge.apk'
      - 'IronForge-debug.apk'
      - 'IronForge-release-unsigned.apk'
      - '.gitattributes'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build IronForge Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV
          mkdir -p "${SDK_ROOT}/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${SDK_ROOT}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "${SDK_ROOT}/licenses/intel-android-extra-license"
          SDKMANAGER=$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
            "${SDKMANAGER}" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Merge exercise dataset & copy local assets
        run: npm run merge:exercise-data

      - name: Run unit tests
        run: npm test

      - name: Build Next.js static export
        run: npm run build

      - name: Sync web assets to Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (Unsigned)
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy APK to root directory
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./IronForge.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./IronForge-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk ./IronForge-release-unsigned.apk
          fi
          ls -lh ./IronForge*.apk

      - name: Commit & Push APK to root directory (with Git LFS support for >100MB APK)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install
          git lfs track "*.apk"
          git add .gitattributes
          git add -f IronForge.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore: update built IronForge.apk in root directory [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "IronForge.apk is already up to date."
          fi

      - name: Publish Latest APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest IronForge Android APK
          make_latest: true
          overwrite_files: true
          files: |
            ./IronForge.apk
            ./IronForge-debug.apk
            ./IronForge-release-unsigned.apk
          generate_release_notes: true
